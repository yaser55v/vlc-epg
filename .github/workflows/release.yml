name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck

      - name: Lua syntax check
        run: luac5.1 -p vlc_epg.lua

      - name: Scan-phase check (no standard library at top level)
        run: lua5.1 tests/scan_phase.lua vlc_epg.lua

      - name: Lint and test the installer
        run: |
          shellcheck -s sh install.sh tests/test_install.sh
          sh tests/test_install.sh vlc_epg.lua

      - name: Check that the tag matches the version in the script
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SCRIPT=$(grep -o 'version = "[0-9.]*"' vlc_epg.lua | head -1 | grep -o '[0-9.]*')
          echo "tag=$TAG script=$SCRIPT"
          test "$TAG" = "$SCRIPT"

      - name: Package
        run: |
          mkdir dist
          cp vlc_epg.lua install.sh install.ps1 LICENSE dist/
          # Point the installers at this repository.
          sed -i "s#OWNER/REPO#${GITHUB_REPOSITORY}#g" dist/install.sh dist/install.ps1
          (cd dist && sha256sum vlc_epg.lua > vlc_epg.lua.sha256)
          (cd dist && zip "../vlc-epg-${GITHUB_REF_NAME}.zip" vlc_epg.lua LICENSE)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vlc_epg.lua
            dist/vlc_epg.lua.sha256
            dist/install.sh
            dist/install.ps1
            vlc-epg-${{ github.ref_name }}.zip
          generate_release_notes: true
