name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: luac5.1 -p vlc_epg.lua
      - name: Scan-phase check (no standard library at top level)
        run: lua5.1 tests/scan_phase.lua vlc_epg.lua
